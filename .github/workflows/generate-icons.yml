name: Build Home Screen Icons
on:
  push:
    paths:
      - icon.svg
      - .github/workflows/generate-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG icons from vector artwork
        run: |
          python -m pip install --quiet cairosvg
          mkdir -p icons
          python -c "import cairosvg; [cairosvg.svg2png(url='icon.svg', write_to=f'icons/icon-{n}.png', output_width=n, output_height=n) for n in (192, 512)]"
          test -s icons/icon-192.png
          test -s icons/icon-512.png
      - name: Save icons to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Build Android and iOS home screen icons"
            git push origin HEAD:main
          fi
