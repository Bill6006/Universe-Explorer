name: Build Home Screen Icons
on:
  push:
    paths:
      - icon-source.webp
      - .github/workflows/generate-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Render PNG icons from selected 2D artwork
        run: |
          python -m pip install --quiet Pillow
          mkdir -p icons
          python - <<'PY'
          from PIL import Image
          with Image.open("icon-source.webp") as im:
              im = im.convert("RGB")
              for size in (192, 512):
                  im.resize((size, size), Image.Resampling.LANCZOS).save(f"icons/icon-{size}.png", optimize=True)
          PY
          test -s icons/icon-192.png
          test -s icons/icon-512.png
      - name: Save icons to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Build Android and iOS home screen icons"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
