name: Publish Universe Explorer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Generate Android and iOS app icons
        run: |
          python -m pip install --quiet cairosvg
          mkdir -p icons
          python -c "import cairosvg; [cairosvg.svg2png(url='icon.svg', write_to=f'icons/icon-{n}.png', output_width=n, output_height=n) for n in (192, 512)]"
          test -s icons/icon-192.png
          test -s icons/icon-512.png
      - name: Package website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
